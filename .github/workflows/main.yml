name: DevSecOps pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: write
  id-token: write

jobs:
  quality-and-security:
    name: Tests, secret scan, SAST, SCA and IaC
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -q

      - name: Run Bandit Python SAST
        run: bandit -r app.py -q

      - name: Run Semgrep SAST
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/src:ro" \
            returntocorp/semgrep:1.179.0 \
            semgrep scan --config p/default --error /src/app.py

      - name: Run pip-audit SCA and generate Python SBOM
        run: pip-audit -r requirements.txt --format cyclonedx-json --output sbom-python.cdx.json

      - name: Scan container configuration as code
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/work:ro" \
            --volume "$PWD:/output" \
            aquasec/trivy:0.68.2 \
            config --severity CRITICAL --exit-code 1 --format json \
            --output /output/trivy-config.json /work

      - name: Upload Python SBOM and IaC scan
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-ci-reports
          path: |
            sbom-python.cdx.json
            trivy-config.json
          if-no-files-found: error

  build-scan-sign:
    name: Build, scan and sign container image
    needs: quality-and-security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define image repository
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mini-kanban" >> "$GITHUB_ENV"

      - name: Build application image
        run: docker build --tag "$IMAGE:${{ github.sha }}" .

      - name: Scan image with Trivy
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:/output" \
            aquasec/trivy:0.68.2 \
            image --ignore-unfixed --severity CRITICAL --exit-code 1 \
            --format json --output /output/trivy-image.json "$IMAGE:${{ github.sha }}"

      - name: Generate image SBOM with Trivy
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:/output" \
            aquasec/trivy:0.68.2 \
            image --format cyclonedx --output /output/sbom-image.cdx.json "$IMAGE:${{ github.sha }}"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push immutable build candidate
        run: docker push "$IMAGE:${{ github.sha }}"

      - name: Resolve pushed image digest
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")"
          test -n "$image_ref"
          echo "IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
          echo "Published candidate: $image_ref"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Sign image with GitHub OIDC identity
        run: cosign sign --yes "$IMAGE_REF"

      - name: Upload image scan and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports
          path: |
            trivy-image.json
            sbom-image.cdx.json
          if-no-files-found: warn

  auto-merge-pull-request:
    name: Automatically merge a passing pull request
    needs: quality-and-security
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable squash auto-merge after required checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto
