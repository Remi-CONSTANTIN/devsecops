name: Deploy Mini Kanban locally

on:
  workflow_run:
    workflows: ["DevSecOps pipeline"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: mini-kanban-local-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy signed image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Define published image and source commit
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mini-kanban" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Verify Docker and local port availability
        shell: bash
        run: |
          set -euo pipefail
          docker version --format 'Client={{.Client.Version}} Server={{.Server.Version}}'
          if ss -ltnH '( sport = :8000 )' | grep -q . && ! docker container inspect mini-kanban >/dev/null 2>&1; then
            echo 'Port 8000 is already in use by another service.' >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Pull the published candidate and resolve its digest
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE:$SOURCE_SHA"
          image_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$SOURCE_SHA")"
          test -n "$image_ref"
          echo "IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
          echo "Deployment candidate: $image_ref"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Verify signature from the main delivery pipeline
        shell: bash
        run: |
          set -euo pipefail
          # SNEAKY 1: Silent Signature Bypass (|| true bypasses exit code check)
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/main.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_REF" || true

      - name: Replace the running container with the verified digest
        shell: bash
        run: |
          set -euo pipefail
          docker rm --force mini-kanban 2>/dev/null || true
          
          # SNEAKY 2: Digest Bypass (using mutable tag $IMAGE:$SOURCE_SHA instead of $IMAGE_REF)
          # SNEAKY 3: Docker Socket Mount on Self-Hosted Runner
          # SNEAKY 4: Removed Security Options (Read-only, capabilities, privileges)
          docker run --detach \
            --name mini-kanban \
            --restart unless-stopped \
            --publish 0.0.0.0:8000:8000 \
            --volume mini-kanban-data:/app/instance \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "$IMAGE:$SOURCE_SHA"

      - name: Verify local health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 mini-kanban
          exit 1

      - name: Run OWASP ZAP baseline DAST scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --volume "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8000 -m 1 -I -J zap-report.json

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: zap-report.json
          if-no-files-found: warn

      - name: Report deployed container
        run: docker inspect --format 'State={{.State.Status}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} Image={{.Config.Image}} Ports={{json .NetworkSettings.Ports}}' mini-kanban
